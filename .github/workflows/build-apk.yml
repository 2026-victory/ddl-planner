name: Build Android APK

# 触发方式：
#   1) 在 GitHub 网页上手动点 Run workflow
#   2) 推送 tag（如 v1.0.0）
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: '后端地址（例如 https://xxx.onrender.com，留空则不预置）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 构建前端（注入后端地址）
        run: |
          if [ -n "${{ github.event.inputs.backend_url }}" ]; then
            node build.js --backend="${{ github.event.inputs.backend_url }}"
          else
            node build.js
          fi

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 允许明文 HTTP（仅当后端是 http）
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
          fi

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ddl-buhuang-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
