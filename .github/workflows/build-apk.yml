name: Build Android APK

# 编译 APK 并发布到 Release（免登录下载）
# 每次运行自动递增 versionCode，保证新版本能覆盖安装旧版本

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # 需要写 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不使用 android-actions/setup-android：
      # 它默认安装 "tools platform-tools"，而 Google 已从 SDK 仓库移除
      # 过时的 `tools` 包，导致 "Failed to find package 'tools'" 退出码 1。
      # ubuntu-latest 镜像已预装 Android SDK，这里只需接受许可。
      - name: 配置 Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::未找到 Android SDK 目录：$SDK_ROOT"
            exit 1
          fi

          SDKMGR=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$candidate" ] && SDKMGR="$candidate"
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager"
            ls "$SDK_ROOT" || true
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "✓ SDK 配置完成"

      - name: 构建前端
        run: node build.js

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 关键：设置递增的 versionCode 和可读的 versionName
      # 否则每次都是 versionCode 1，安卓会拒绝覆盖安装
      - name: 设置版本号
        run: |
          set -euo pipefail
          BUILD_NUM=${{ github.run_number }}
          BASE_VERSION=$(node -p "require('./package.json').version")
          echo "versionName=${BASE_VERSION}.${BUILD_NUM}" >> "$GITHUB_ENV"
          echo "versionCode=${BUILD_NUM}" >> "$GITHUB_ENV"

          GRADLE=android/app/build.gradle
          if [ ! -f "$GRADLE" ]; then
            echo "::error::找不到 $GRADLE"
            ls android/app/ || true
            exit 1
          fi

          echo "--- 修改前 ---"
          grep -E "versionCode|versionName" "$GRADLE" || true

          # 替换 versionCode / versionName（两者都在 defaultConfig 里）
          sed -i -E "s/versionCode [0-9]+/versionCode ${BUILD_NUM}/g" "$GRADLE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${BASE_VERSION}.${BUILD_NUM}\"/g" "$GRADLE"

          echo "--- 修改后 ---"
          grep -E "versionCode|versionName" "$GRADLE" || true

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 重命名并校验 APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ddl-buhuang.apk
          ls -lh out/
          echo "APK 版本信息："
          echo "  versionCode: ${versionCode}"
          echo "  versionName: ${versionName}"

      - name: 上传到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: ddl-buhuang-apk
          path: out/ddl-buhuang.apk
          retention-days: 30

      # 发布到 Release（免登录直接下载，链接可发微信）
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DDL 不慌 v${{ env.versionName }}
          body: |
            ## 安装说明

            1. 手机浏览器打开本页
            2. 点下方 `ddl-buhuang.apk` 下载
            3. 点开安装，允许「未知来源」

            **版本：** `${{ env.versionName }}`（versionCode `${{ env.versionCode }}`）

            **数据只存手机本地，不联网、不需要注册。**

            > ✅ 直接覆盖安装即可更新，**数据不会丢**
            > ❌ 不要先卸载，卸载会清空数据
            > 💾 重要数据建议先在应用内「设置 → 备份数据」导出
          files: out/ddl-buhuang.apk
          fail_on_unmatched_files: true
