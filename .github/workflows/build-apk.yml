name: Build Android APK

# 纯本地版：数据存在手机里，不需要后端、不需要填写任何地址。
# 触发：GitHub 网页手动点 Run workflow，或推送 v* 标签

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不使用 android-actions/setup-android：
      # 它默认安装 "tools platform-tools"，而 Google 已从 SDK 仓库移除
      # 过时的 `tools` 包，导致 "Failed to find package 'tools'" 退出码 1。
      # ubuntu-latest 镜像已预装 Android SDK，这里只需接受许可。
      - name: 配置 Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::未找到 Android SDK 目录：$SDK_ROOT"
            exit 1
          fi

          # 找 sdkmanager（cmdline-tools 下可能是 latest，也可能是版本号目录）
          SDKMGR=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$candidate" ] && SDKMGR="$candidate"
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager"
            ls "$SDK_ROOT" || true
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"

          # 接受许可（失败不阻塞，Gradle 构建时会自动补装所需组件）
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "✓ SDK 配置完成"

      - name: 构建前端
        run: node build.js

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ddl-buhuang-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
