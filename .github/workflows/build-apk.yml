name: Build Android APK

# 编译 APK 并发布到 Release（免登录下载）
# 触发：Actions 页面手动 Run workflow

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # 需要写 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不使用 android-actions/setup-android：
      # 它默认安装 "tools platform-tools"，而 Google 已从 SDK 仓库移除
      # 过时的 `tools` 包，导致 "Failed to find package 'tools'" 退出码 1。
      # ubuntu-latest 镜像已预装 Android SDK，这里只需接受许可。
      - name: 配置 Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::未找到 Android SDK 目录：$SDK_ROOT"
            exit 1
          fi

          SDKMGR=""
          for candidate in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$candidate" ] && SDKMGR="$candidate"
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager"
            ls "$SDK_ROOT" || true
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"

          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          echo "✓ SDK 配置完成"

      - name: 构建前端
        run: node build.js

      - name: 安装依赖
        run: npm install

      - name: 生成 Android 工程
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 把产物重命名成好认的名字
      - name: 重命名 APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ddl-buhuang.apk
          ls -lh out/

      # 上传到 Actions 产物（需登录下载）
      - name: 上传到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: ddl-buhuang-apk
          path: out/ddl-buhuang.apk
          retention-days: 30

      # 发布到 Release（免登录直接下载，可发微信）
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DDL 不慌 构建 ${{ github.run_number }}
          body: |
            ## 安装说明

            1. 手机浏览器打开本页
            2. 点下方 `ddl-buhuang.apk` 下载
            3. 点开安装，允许「未知来源」

            **数据只存手机本地，不联网、不需要注册。**

            > 覆盖安装不会丢数据；卸载重装会丢，请先在应用内「设置 → 备份数据」导出。
          files: out/ddl-buhuang.apk
          fail_on_unmatched_files: true
